name: Daily news delivery

on:
  schedule:
    # 北京时间 07:45：避开 UTC 整点的 Actions 调度高峰，为 08:00 推送留出缓冲。
    - cron: "45 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r daily-news-bot/requirements.txt
      - name: Build and send daily news
        working-directory: daily-news-bot
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          PAGE_URL: ${{ secrets.PAGE_URL }}
          NEWSNOW_BASE_URL: ${{ vars.NEWSNOW_BASE_URL }}
          BILIBILI_SESSDATA: ${{ secrets.BILIBILI_SESSDATA }}
        run: python main.py
      - name: Save sent Bilibili video history
        working-directory: daily-news-bot
        run: |
          if git diff --quiet -- data/sent_bilibili_videos.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent_bilibili_videos.json
          git commit -m "chore: record sent Bilibili videos"
          git push
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: daily-news-bot

  deploy-pages:
    needs: build-and-send
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
